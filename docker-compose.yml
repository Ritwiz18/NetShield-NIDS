version: '3.8'

services:
  # ── Python FastAPI Backend & NIDS Engine ───────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: netshield-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Linux Network & Scapy Live Packet Capture Capabilities
    # On Linux Cloud VMs, NET_ADMIN & NET_RAW allow Scapy to bind raw network sockets
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # On Linux Cloud VM hosts, uncommenting network_mode: host grants direct physical adapter access
    # network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HOST_INTERFACE=${HOST_INTERFACE:-}
    # Production Resource Allocation (Accommodates 1.47 GB ML Model Artifacts)
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1.5G
    # Container Log Rotation Configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 12s

  # ── React + Vite Production SOC Web Dashboard ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netshield-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    # Container Log Rotation Configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
